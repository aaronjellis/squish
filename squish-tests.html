<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Squish conversion test suite</title>
<style>
  :root{--bg:#191526;--slab:#2b2440;--ink:#f6f0ea;--dim:#b6abce;--green:#9be072;--red:#ff7eb6;--teal:#3fd6c4;
    --font:'SF Pro Rounded',ui-rounded,'Nunito',system-ui,-apple-system,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);padding:34px;max-width:900px;margin:0 auto}
  h1{font-size:26px;font-weight:800;margin:0 0 4px}
  .sub{color:var(--dim);font-size:14px;margin-bottom:22px}
  #summary{display:inline-flex;gap:18px;align-items:center;background:var(--slab);border-radius:16px;padding:14px 22px;margin-bottom:20px;font-weight:800;font-size:16px}
  #summary .ok{color:var(--green)} #summary .bad{color:var(--red)}
  .group{margin:18px 0 8px;font-weight:800;font-size:14px;color:var(--teal);text-transform:uppercase;letter-spacing:.8px}
  .t{display:flex;gap:12px;align-items:baseline;padding:9px 14px;border-radius:11px;background:var(--slab);margin-bottom:6px;font-size:13.5px;line-height:1.4}
  .t .mark{font-weight:800;flex:none;width:20px}
  .t.pass .mark{color:var(--green)} .t.fail{outline:2px solid var(--red)} .t.fail .mark{color:var(--red)}
  .t .detail{color:var(--dim);font-size:12px}
  .run{all:unset;cursor:pointer;background:linear-gradient(135deg,var(--green),var(--teal));color:#173322;font-weight:800;
    padding:12px 22px;border-radius:14px;font-size:15px;margin-left:12px}
</style>
</head>
<body>
  <h1>🧪 Squish conversion tests</h1>
  <div class="sub">Runs the real conversion engines from <b>squish-core.js</b> against generated sample files, in your actual browser. <button class="run" id="rerun">Re-run</button></div>
  <div id="summary">running…</div>
  <div id="out"></div>

<script src="squish-core.js"></script>
<script src="squish-engines.js"></script>
<script>
const C = SquishCore;
const out = document.getElementById("out"), summary = document.getElementById("summary");
let pass=0, fail=0, curGroup=null;
function group(t){curGroup=document.createElement("div");curGroup.className="group";curGroup.textContent=t;out.appendChild(curGroup);}
function ok(name, cond, detail){const d=document.createElement("div");d.className="t "+(cond?"pass":"fail");
  d.innerHTML=`<span class="mark">${cond?"✓":"✗"}</span><span><b>${name}</b>${detail?`<div class="detail">${detail}</div>`:""}</span>`;
  out.appendChild(d); cond?pass++:fail++;}

/* ---- sample-file builders ---- */
function canvasToFile(draw,w,h,name){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"));
  return new Promise(res=>c.toBlob(b=>res(new File([b],name,{type:"image/png"})),"image/png"));}
function svgFile(){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
    <path d="M10 10 L110 10 C110 40 60 70 10 70 Q10 40 10 10 Z"/>
    <line x1="0" y1="0" x2="120" y2="80"/></svg>`;
  return new File([svg],"sample.svg",{type:"image/svg+xml"});
}
function decode(blob){return new Promise((res)=>{const i=new Image();const u=URL.createObjectURL(blob);
  i.onload=()=>res({w:i.naturalWidth,h:i.naturalHeight});i.onerror=()=>res(null);i.src=u;});}
const noP=()=>{};
async function fx(name,type){const r=await fetch("fixtures/"+name);if(!r.ok)throw new Error("missing fixture "+name);return new File([await r.blob()],name,{type});}
async function head(blob,n){return new Uint8Array(await blob.slice(0,n).arrayBuffer());}
const ascii=u8=>String.fromCharCode(...u8);
function countSig(u8,sig){let c=0;for(let i=0;i<u8.length-3;i++){if(u8[i]===sig[0]&&u8[i+1]===sig[1]&&u8[i+2]===sig[2]&&u8[i+3]===sig[3])c++;}return c;}
async function tryEngine(eng,file,opts,toExt){const labels=[];try{const r=await C.ENGINES[eng](file,opts,(f,l)=>{if(l)labels.push(l);},toExt);return {r,labels};}catch(e){return {err:e,labels};}}

async function run(){
  out.innerHTML="";pass=0;fail=0;

  group("Registry integrity");
  let badFrom=[],badTo=[],badEng=[];
  C.CONVERTERS.forEach(cv=>{cv.from.forEach(f=>{if(!C.FORMATS[C.norm(f)])badFrom.push(f);});
    cv.to.forEach(t=>{if(!C.FORMATS[C.norm(t)])badTo.push(t);});
    if(cv.status==="available"&&!C.ENGINES[cv.engine])badEng.push(cv.engine);});
  ok("every 'from' ext is described", badFrom.length===0, badFrom.length?("missing: "+badFrom):"");
  ok("every 'to' ext is described", badTo.length===0, badTo.length?("missing: "+badTo):"");
  ok("every available converter has an engine", badEng.length===0, badEng.join(","));
  let noDesc=Object.entries(C.FORMATS).filter(([k,v])=>!v.desc||v.desc.length<10).map(([k])=>k);
  ok("every format has a real description", noDesc.length===0, noDesc.join(","));

  group("Capability logic");
  ok("png→jpg → raster engine", C.findConverter("png","jpg")?.engine==="raster");
  ok("svg→dxf → svgDxf engine", C.findConverter("svg","dxf")?.engine==="svgDxf");
  ok("png→png not offered (same format)", !C.possibleTargets("png").has("png"));
  ok("pdf→pptx flagged 'planned'", C.possibleTargets("pdf").get("pptx")==="planned");
  ok("pdf→mp4 is impossible (explained)", !!C.impossibleReason("pdf","mp4"));
  ok("png→webp has no impossible reason", !C.impossibleReason("png","webp"));

  group("Image conversions (real canvas output)");
  const png = await canvasToFile((ctx)=>{ctx.fillStyle="#3fd6c4";ctx.fillRect(0,0,200,120);ctx.fillStyle="#ff7eb6";ctx.fillRect(40,30,120,60);},200,120,"pic.png");
  const jpg = await C.ENGINES.raster(png,{quality:80,resize:"1"},noP,"jpg");
  ok("png→jpg produces a JPEG blob", jpg && jpg.type==="image/jpeg" && jpg.size>0, jpg?C.fmtBytes(jpg.size):"no blob");
  let dj = await decode(jpg); ok("…and it decodes at original size", dj && dj.w===200 && dj.h===120, dj?`${dj.w}×${dj.h}`:"undecodable");
  const webp = await C.ENGINES.raster(png,{quality:80,resize:"1"},noP,"webp");
  ok("png→webp produces a WebP blob", webp && webp.type==="image/webp" && webp.size>0, webp?C.fmtBytes(webp.size):"");
  const half = await C.ENGINES.raster(png,{quality:90,resize:"0.5"},noP,"png");
  let dh = await decode(half); ok("resize 50% halves the dimensions", dh && dh.w===100 && dh.h===60, dh?`${dh.w}×${dh.h}`:"");
  const repng = await C.ENGINES.raster(png,{quality:90,resize:"1"},noP,"png");
  let dp = await decode(repng); ok("png→png round-trips and decodes", dp && dp.w===200, dp?`${dp.w}×${dp.h}`:"");

  group("SVG rasterizing");
  const svg = svgFile();
  const spng = await C.ENGINES.svgRaster(svg,{dpi:"150",quality:"90",bg:"transparent"},noP,"png");
  let ds = await decode(spng);
  ok("svg→png decodes", ds && ds.w>0 && ds.h>0, ds?`${ds.w}×${ds.h}`:"undecodable");
  ok("150 DPI scales 120×80 up (~1.56×)", ds && ds.w>120 && Math.abs(ds.w-120*150/96)<=2, ds?`${ds.w}px (expected ~${Math.round(120*150/96)})`:"");

  group("SVG → DXF (vector, real emitter)");
  const dxfBlobS = await C.ENGINES.svgDxf(svg,{curveMode:"splines"},noP);
  const dxfS = await dxfBlobS.text();
  ok("DXF is well-formed (SECTION…EOF)", dxfS.startsWith("0\nSECTION")&&dxfS.trim().endsWith("EOF"));
  ok("splines mode emits SPLINE entities", (dxfS.match(/\nSPLINE\n/g)||[]).length===2, (dxfS.match(/\nSPLINE\n/g)||[]).length+" splines");
  ok("splines mode has NO polylines", !/LWPOLYLINE/.test(dxfS));
  ok("closed path (Z) emits ≥2 LINE entities", (dxfS.match(/\nLINE\n/g)||[]).length>=2, (dxfS.match(/\nLINE\n/g)||[]).length+" lines");
  const dxfBlobP = await C.ENGINES.svgDxf(svg,{curveMode:"polylines",tolerance:"0.5"},noP);
  const dxfP = await dxfBlobP.text();
  ok("polylines mode emits LWPOLYLINE", /LWPOLYLINE/.test(dxfP));
  ok("polylines mode has NO splines", !/\nSPLINE\n/.test(dxfP));

  group("PDF heuristics");
  const textPdf = new Blob(["%PDF-1.4 /Font /Helvetica BT (hello) Tj ET /Count 1"],{type:"application/pdf"});
  const scanPdf = new Blob(["%PDF-1.4 /XObject /Image /DCTDecode stream......endstream /Count 3"],{type:"application/pdf"});
  ok("text PDF is NOT flagged image-based", (await C.detectImagePdf(textPdf))===false);
  ok("scanned PDF IS flagged image-based", (await C.detectImagePdf(scanPdf))===true);
  ok("page count reads /Count", (await C.detectPdfPages(scanPdf))===3, "got "+(await C.detectPdfPages(scanPdf)));


  group("SVG → DXF: shapes, arcs, transforms");
  let t, s;
  const shapesSvg = await fx("shapes.svg","image/svg+xml");
  t = await tryEngine("svgDxf",shapesSvg,{curveMode:"splines"},"dxf"); s = t.r instanceof Blob ? await t.r.text() : "";
  ok("rounded rect, circle, and arc emit splines (≥ 9)", (s.match(/\nSPLINE\n/g)||[]).length>=9, (s.match(/\nSPLINE\n/g)||[]).length+" splines"+(t.err?" "+t.err.message:""));
  ok("circle inside the translated group lands at x≈160", /\n10\n160\n/.test(s), "");
  ok("polygon gives 3 LINE entities", (s.match(/\nLINE\n/g)||[]).length>=3, (s.match(/\nLINE\n/g)||[]).length+" lines");
  t = await tryEngine("svgDxf",new File(["<svg><rect"],"bad.svg",{type:"image/svg+xml"}),{},"dxf");
  ok("invalid SVG fails with a plain message", t.err && /couldn't read this SVG/.test(t.err.message), String(t.err?.message));
  group("PDF → images (pdf.js)");
  const pdfFx = await fx("two-page.pdf","application/pdf");
  t = await tryEngine("pdfRaster",pdfFx,{dpi:"96",pages:""},"png");
  ok("two pages return a zip with a .zip name", t.r && t.r.blob && t.r.name==="two-page.zip", t.err?String(t.err.message):t.r?.name);
  if(t.r && t.r.blob){const z=new Uint8Array(await t.r.blob.arrayBuffer());
    ok("zip has two central directory entries", countSig(z,[0x50,0x4b,0x01,0x02])===2, countSig(z,[0x50,0x4b,0x01,0x02])+" entries");}
  ok("progress reported a label", t.labels.length>0, t.labels.join(" | "));
  t = await tryEngine("pdfRaster",pdfFx,{dpi:"96",pages:"2"},"png");
  let dpdf = t.r instanceof Blob ? await decode(t.r) : null;
  ok("single page returns a PNG at 96 dpi (816 px wide)", dpdf && Math.abs(dpdf.w-816)<=2, dpdf?`${dpdf.w}×${dpdf.h}`:String(t.err?.message));
  t = await tryEngine("pdfRaster",pdfFx,{dpi:"150",pages:"1"},"jpg");
  dpdf = t.r instanceof Blob ? await decode(t.r) : null;
  ok("jpg at 150 dpi is 1275 px wide", t.r?.type==="image/jpeg" && dpdf && Math.abs(dpdf.w-1275)<=2, dpdf?`${dpdf.w}×${dpdf.h}`:String(t.err?.message));
  t = await tryEngine("pdfRaster",pdfFx,{dpi:"96",pages:"9"},"png");
  ok("pages that match nothing fail with a clear message", t.err && /No pages matched/.test(t.err.message), String(t.err?.message));
  t = await tryEngine("pdfRaster",new File([new Uint8Array([1,2,3,4,5])],"bad.pdf",{type:"application/pdf"}),{},"png");
  ok("corrupt PDF fails with a plain message", t.err && /couldn't read this PDF/i.test(t.err.message), String(t.err?.message));
  group("Documents (md, html, rtf, txt in; html, md, txt out)");
  const mdFx = await fx("short.md","text/markdown"), htmlFx = await fx("sample.html","text/html"),
        rtfFx = await fx("sample.rtf","application/rtf"), txtFx = await fx("sample.txt","text/plain");
  t = await tryEngine("docs",mdFx,{},"html"); s = t.r instanceof Blob ? await t.r.text() : "";
  ok("md → html has heading, bold, link, lists", /<h1>Squish fixture<\/h1>/.test(s)&&/<strong>bold<\/strong>/.test(s)&&/<a href="https:\/\/example.com">link<\/a>/.test(s)&&/<ol>/.test(s)&&/<ul>/.test(s), t.err?String(t.err.message):"");
  ok("md → html keeps the code block and hr", /<pre><code>let x = 1;<\/code><\/pre>/.test(s)&&/<hr>/.test(s));
  t = await tryEngine("docs",mdFx,{},"md"); s = t.r instanceof Blob ? await t.r.text() : "";
  ok("md → md round-trips structure", s.startsWith("# Squish fixture")&&s.includes("**bold**")&&s.includes("- one\n- two")&&s.includes("1. first\n2. second")&&s.includes("> A quote."), t.err?String(t.err.message):s.slice(0,80));
  t = await tryEngine("docs",mdFx,{},"txt"); s = t.r instanceof Blob ? await t.r.text() : "";
  ok("md → txt strips markup", s.includes("Squish fixture")&&!s.includes("**")&&!s.includes("](")&&s.includes("1. first"), t.err?String(t.err.message):s.slice(0,80));
  t = await tryEngine("docs",htmlFx,{},"md"); s = t.r instanceof Blob ? await t.r.text() : "";
  ok("html → md: heading, link, bullets, code; no style text", s.includes("## Sample heading")&&s.includes("[a link](https://example.com)")&&s.includes("- alpha")&&s.includes("```\ncode here\n```")&&!s.includes("color:red"), t.err?String(t.err.message):s.slice(0,120));
  t = await tryEngine("docs",rtfFx,{},"txt"); s = t.r instanceof Blob ? await t.r.text() : "";
  ok("rtf → txt has clean text", s.includes("Hello bold world")&&s.includes("Second \u00e9 paragraph")&&!/[{}\\]/.test(s), t.err?String(t.err.message):s);
  t = await tryEngine("docs",rtfFx,{},"html"); s = t.r instanceof Blob ? await t.r.text() : "";
  ok("rtf → html keeps bold", /<strong>bold<\/strong>/.test(s), t.err?String(t.err.message):"");
  t = await tryEngine("docs",txtFx,{},"html"); s = t.r instanceof Blob ? await t.r.text() : "";
  ok("txt → html makes two paragraphs", (s.match(/<p>/g)||[]).length===2, t.err?String(t.err.message):"");
  t = await tryEngine("docs",await fx("latin1.txt","text/plain"),{},"html"); s = t.r instanceof Blob ? await t.r.text() : "";
  ok("Latin-1 text decodes (accents and curly quotes)", s.includes("caf"+String.fromCharCode(0xe9))&&s.includes(String.fromCharCode(0x201c)+"quoted"+String.fromCharCode(0x201d)), t.err?String(t.err.message):s.slice(-80));
  t = await tryEngine("docs",new File([""],"empty.txt",{type:"text/plain"}),{},"html");
  ok("empty input fails clearly", t.err && /couldn't find any text/i.test(t.err.message), String(t.err?.message));
  t = await tryEngine("docs",mdFx,{},"docx");
  ok("md → docx is a zip (PK) over 2 KB", t.r instanceof Blob && t.r.size>2048 && ascii(await head(t.r,2))==="PK", t.err?String(t.err.message):C.fmtBytes(t.r?.size||0));
  ok("md → docx has the Word mime type", t.r?.type==="application/vnd.openxmlformats-officedocument.wordprocessingml.document");
  t = await tryEngine("docs",mdFx,{},"pdf");
  ok("md → pdf starts with %PDF (emoji did not crash it)", t.r instanceof Blob && ascii(await head(t.r,4))==="%PDF", t.err?String(t.err.message):C.fmtBytes(t.r?.size||0));
  const nlMd = new File(["Break<br>here\n\n```\nlet x = 1;\nlet y = 2;\n```\n"],"nl.md",{type:"text/markdown"});
  t = await tryEngine("docs",nlMd,{},"pdf");
  if(t.r instanceof Blob){const back = await C.openPdf(new File([t.r],"nl.pdf",{type:"application/pdf"}),noP); const pg = await back.getPage(1); const tc = await pg.getTextContent(); const txt = tc.items.map(i=>i.str).join(""); await back.destroy();
    ok("md → pdf keeps line breaks (no ? for newlines)", txt.includes("let x = 1;") && txt.includes("let y = 2;") && !txt.includes("?"), txt.slice(0,120));}
  else ok("md → pdf keeps line breaks (no ? for newlines)", false, String(t.err?.message));
  const longTxt = new File([Array.from({length:120},(_,i)=>"Paragraph "+(i+1)+" of a long document that needs more than one page when laid out at eleven points on Letter paper.").join("\n\n")],"long.txt",{type:"text/plain"});
  t = await tryEngine("docs",longTxt,{},"pdf");
  if(t.r instanceof Blob){const back = await C.openPdf(new File([t.r],"long.pdf",{type:"application/pdf"}),noP); ok("long txt → pdf breaks across pages", back.numPages>=2, back.numPages+" pages"); await back.destroy();}
  else ok("long txt → pdf breaks across pages", false, String(t.err?.message));
  group("PDF → Word (text layer)");
  t = await tryEngine("pdfDocx",pdfFx,{},"docx");
  ok("two-page.pdf → docx is a Word file", t.r instanceof Blob && ascii(await head(t.r,2))==="PK" && t.r.size>2048, t.err?String(t.err.message):C.fmtBytes(t.r?.size||0));
  ok("progress labels mention reading pages", t.labels.some(l=>/reading page/.test(l)), t.labels.join(" | "));
  const noTextPdf = new File([new TextEncoder().encode("%PDF-1.4\n1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj\n2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj\n3 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 100 100] >> endobj\ntrailer << /Root 1 0 R >>")],"blank.pdf",{type:"application/pdf"});
  t = await tryEngine("pdfDocx",noTextPdf,{},"docx");
  ok("a PDF with no text fails with the scanned-pages message", t.err && /no selectable text/.test(t.err.message), String(t.err?.message||"produced a file"));
  group("Release polish");
  const longWord = "https://example.com/"+"a".repeat(260);
  t = await tryEngine("docs",new File(["See "+longWord+" for more.\n\n```\n"+"x".repeat(200)+"\n```\n"],"long.md",{type:"text/markdown"}),{},"pdf");
  if(t.r instanceof Blob){const back = await C.openPdf(new File([t.r],"lw.pdf",{type:"application/pdf"}),noP); const pg = await back.getPage(1); const tc = await pg.getTextContent();
    const right = Math.max(...tc.items.filter(i=>i.str.trim()).map(i=>i.transform[4]+i.width)); const joined = tc.items.map(i=>i.str).join(""); await back.destroy();
    ok("a word wider than the column wraps inside the margin", right <= 612-72+1, "rightmost text edge "+right.toFixed(1)+" pt");
    ok("…and no characters are lost when it wraps", joined.replace(/\s/g,"").includes(longWord) && joined.includes("x".repeat(200)), joined.length+" chars");}
  else { ok("a word wider than the column wraps inside the margin", false, String(t.err?.message)); }
  let destroyed=false; const realOpen=C.openPdf;
  C.openPdf=async(...a)=>{const d=await realOpen(...a);const realDestroy=d.destroy.bind(d);d.destroy=()=>{destroyed=true;return realDestroy();};return d;};
  t = await tryEngine("pdfRaster",pdfFx,{dpi:"100000",pages:"1"},"png");
  C.openPdf=realOpen;
  ok("a failed render still releases the PDF worker", !!t.err && destroyed, (t.err?String(t.err.message).slice(0,80):"no error")+" | destroyed="+destroyed);
  t = await tryEngine("docs",new File(['<p>Logo: <img alt="Squish logo" src="x.png"></p><p><img src="y.png"></p>'],"img.html",{type:"text/html"}),{},"txt");
  s = t.r instanceof Blob ? await t.r.text() : "";
  ok("images in html keep a visible placeholder with their alt text", s.includes("[image: Squish logo]") && s.includes("[image]"), t.err?String(t.err.message):JSON.stringify(s));
  t = await tryEngine("ffmpeg",await fx("one-second.wav","audio/wav"),{trim:"five to twelve"},"mp3");
  ok("a malformed trim fails fast with the expected format", t.err && /m:ss-m:ss/.test(t.err.message) && !t.labels.some(l=>/download/.test(l)), String(t.err?.message||"no error")+" | "+t.labels.join(","));
  if(new URLSearchParams(location.search).get("ffmpeg")==="1"){
    group("Video and audio (ffmpeg.wasm, downloads the 31 MB core)");
    const wavFx = await fx("one-second.wav","audio/wav"), mp4Fx = await fx("one-second.mp4","video/mp4");
    t = await tryEngine("ffmpeg",wavFx,{quality:"85",samplerate:"keep",channels:"keep"},"mp3");
    let hd = t.r instanceof Blob ? await head(t.r,3) : new Uint8Array(3);
    ok("wav → mp3 (ID3 or frame sync)", t.r instanceof Blob && t.r.type==="audio/mpeg" && (ascii(hd)==="ID3" || (hd[0]===0xFF && (hd[1]&0xE0)===0xE0)), t.err?String(t.err.message):C.fmtBytes(t.r?.size||0));
    ok("download progress was labeled", t.labels.some(l=>/video engine/.test(l)), t.labels.slice(0,3).join(" | "));
    t = await tryEngine("ffmpeg",wavFx,{quality:"85"},"ogg");
    ok("wav → ogg starts with OggS", t.r instanceof Blob && ascii(await head(t.r,4))==="OggS", t.err?String(t.err.message):"");
    t = await tryEngine("ffmpeg",mp4Fx,{target:"balanced",resolution:"keep",fps:"keep",trim:""},"gif");
    ok("mp4 → gif starts with GIF8", t.r instanceof Blob && ascii(await head(t.r,4))==="GIF8", t.err?String(t.err.message):"");
    t = await tryEngine("ffmpeg",mp4Fx,{},"mp3");
    hd = t.r instanceof Blob ? await head(t.r,3) : new Uint8Array(3);
    ok("mp4 → mp3 extracts the audio", t.r instanceof Blob && (ascii(hd)==="ID3" || hd[0]===0xFF), t.err?String(t.err.message):"");
    t = await tryEngine("ffmpeg",mp4Fx,{target:"small",resolution:"keep",fps:"keep",trim:"0:00-0:00.5"},"mp4");
    ok("mp4 → mp4 with trim produces an MP4 (ftyp box)", t.r instanceof Blob && ascii((await head(t.r,8)).subarray(4,8))==="ftyp", t.err?String(t.err.message):"");
    // 4. a crashed engine must not wedge later conversions
    const ffBefore = await C.getFFmpeg(noP); const realExec = ffBefore.exec; ffBefore.exec = () => Promise.reject(new Error("simulated wasm abort"));
    t = await tryEngine("ffmpeg",wavFx,{quality:"85"},"mp3");
    ok("an aborted conversion reports an error", !!t.err, t.err?String(t.err.message):"no error");
    t = await tryEngine("ffmpeg",wavFx,{quality:"85"},"mp3");
    ok("the next conversion after an abort succeeds on a fresh engine", t.r instanceof Blob && t.r.size>0, t.err?String(t.err.message):C.fmtBytes(t.r?.size||0));
    if(ffBefore.exec!==realExec) ffBefore.exec = realExec;
  }else{
    group("Video and audio");
    ok("skipped: add ?ffmpeg=1 to the URL to run the ffmpeg.wasm tests (downloads 31 MB)", true);
  }
  summary.innerHTML = fail===0
    ? `<span class="ok">✓ ${pass} passed</span> · 0 failed`
    : `<span class="ok">${pass} passed</span> · <span class="bad">✗ ${fail} failed</span>`;
}
document.getElementById("rerun").addEventListener("click",run);
run();
</script>
</body>
</html>
